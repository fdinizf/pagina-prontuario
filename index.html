<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d1117">
  <title>🎙️ Prontuário Áudio</title>
  <style>
    :root{color-scheme:dark;--bg:#0d1117;--panel:#161b22;--text:#e6edf3;--muted:#8b949e;--accent:#ff9500;--line:#30363d}
    body.light{color-scheme:light;--bg:#f6f8fa;--panel:#fff;--text:#1f2328;--muted:#656d76;--accent:#bc4c00;--line:#d1d9e0}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}header{position:sticky;top:0;z-index:3;background:var(--panel);border-bottom:2px solid var(--accent);padding:1rem}.header-inner,main{width:min(1100px,100%);margin:auto}.header-inner{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}h1{margin:0;font-size:1.35rem}button,input,textarea{font:inherit}button{cursor:pointer}.toolbar,.controls{display:flex;gap:.55rem;align-items:center;flex-wrap:wrap}.toolbar input{width:min(330px,68vw);padding:.55rem .75rem;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px}.btn{padding:.5rem .75rem;border:1px solid var(--accent);border-radius:8px;color:var(--accent);background:transparent}.btn[aria-pressed=true]{background:var(--accent);color:var(--bg)}main{padding:1rem}.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:1rem;margin-bottom:1rem}.player{position:sticky;top:88px;z-index:2}.now{font-weight:650;margin:0 0 .4rem}.seek-wrap{position:relative;padding:1rem 0 .2rem}.seek{width:100%;accent-color:var(--accent);cursor:pointer}.pig{position:absolute;top:-.05rem;left:0;transform:translateX(-50%);font-size:1.35rem;pointer-events:none;transition:left .08s linear}.times{display:flex;justify-content:space-between;color:var(--muted);font-size:.8rem;margin-top:-.25rem}.controls{justify-content:center;margin:.6rem 0}.speed{color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:.45rem}.volume{width:90px;accent-color:var(--accent)}.status{color:var(--muted);padding:.75rem 0}.module{border:1px solid var(--line);border-radius:8px;margin:.7rem 0;overflow:hidden}.module summary{cursor:pointer;padding:.75rem 1rem;background:var(--panel);font-weight:650}.module-count{color:var(--muted);font-weight:400;font-size:.85rem}.audio-row{display:flex;align-items:center;gap:.55rem;border-top:1px solid var(--line);padding:.6rem .8rem}.play{border:0;background:transparent;color:var(--text);text-align:left;flex:1;overflow-wrap:anywhere}.play.current{color:var(--accent)}.heard{white-space:nowrap;color:var(--muted);font-size:.82rem}.heard input{accent-color:var(--accent)}.fav{border:0;background:transparent;color:var(--muted);font-size:1.2rem}.fav.active{color:#ff6b6b}textarea{width:100%;min-height:75px;resize:vertical;padding:.65rem;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px}.small{font-size:.82rem;color:var(--muted)}@media(max-width:600px){.player{top:0}.header-inner{align-items:flex-start}.controls .btn{padding:.4rem .55rem}}
  </style>
</head>
<body>
  <header><div class="header-inner"><h1>🎙️ Prontuário Áudio</h1><div class="toolbar"><input id="search" type="search" placeholder="🔍 Buscar áudio ou módulo…" aria-label="Buscar áudio"><button class="btn" id="favoritesOnly" type="button" aria-pressed="false">☆ Favoritos</button><button class="btn" id="theme" type="button" aria-label="Alternar tema">☀️/🌙</button></div></div></header>
  <main>
    <section class="panel player" aria-label="Reprodutor de áudio">
      <p class="now" id="nowPlaying">Selecione um áudio para reproduzir</p>
      <audio id="audio" preload="metadata"></audio>
      <div class="seek-wrap"><span class="pig" id="pig" aria-hidden="true">🐷</span><input class="seek" id="seek" type="range" min="0" max="1000" value="0" aria-label="Posição do áudio"><div class="times"><span id="currentTime">0:00</span><span id="duration">0:00</span></div></div>
      <div class="controls"><button class="btn" id="previous" type="button" aria-label="Áudio anterior">⏮</button><button class="btn" id="back10" type="button">↶ 10 s</button><button class="btn" id="playPause" type="button">▶ Reproduzir</button><button class="btn" id="forward30" type="button">30 s ↷</button><button class="btn" id="next" type="button" aria-label="Próximo áudio">⏭</button><button class="btn" id="continuous" type="button" aria-pressed="false">🔁 Contínuo: não</button><label class="small" for="speed">Velocidade</label><select class="speed" id="speed" aria-label="Velocidade de reprodução"><option>1</option><option>1.25</option><option>1.5</option><option>1.8</option><option>2</option></select><label class="small" for="volume">🔊</label><input class="volume" id="volume" type="range" min="0" max="1" step="0.05" value="1" aria-label="Volume"></div>
    </section>
    <section class="panel"><strong>📝 Anotações do áudio atual</strong><textarea id="notes" placeholder="Suas anotações ficam salvas neste navegador..."></textarea><div class="small">Salvas localmente neste dispositivo.</div></section>
    <section class="panel"><strong>📚 Módulos e episódios</strong><div id="status" class="status">Carregando áudios…</div><div id="list"></div></section>
  </main>
  <script>
    (()=>{
      const API='https://api.github.com/repos/fdinizf/pagina-prontuario/releases/tags/1.0';
      const $=id=>document.getElementById(id), audio=$('audio'), search=$('search'), list=$('list'), status=$('status');
      let tracks=[],current=-1,favoriteFilter=false,continuous=false;
      const read=(key,fallback)=>{try{return JSON.parse(localStorage.getItem(key))??fallback}catch{return fallback}};
      const favorites=new Set(read('prontuario:favorites',[])), heard=new Set(read('prontuario:heard',[])), savedNotes=read('prontuario:notes',{});
      function fmt(sec){if(!Number.isFinite(sec))return '0:00';const m=Math.floor(sec/60),s=Math.floor(sec%60);return `${m}:${String(s).padStart(2,'0')}`}
      function moduleName(file){
        const n=file.replace(/\.m4a$/i,'');
        if(/^HMEC/i.test(n))return 'HMEC • '+(n.match(/^HMEC\.-\.(.*?)(?:\.-\.|$)/i)?.[1]?.replace(/[._-]+/g,' ')||'Geral');
        if(/^TOCE/i.test(n))return 'TOCE • Cirurgia';
        if(/^PMSUS/i.test(n))return 'PMSUS';
        if(/^NCS/i.test(n)){const code=n.match(/^NCS\.-\.(SP\.\d+\.\d+|\d+\.\d+)/i)?.[1];return code?`NCS • Módulo ${code}`:'NCS • '+(n.split('.').filter(Boolean).slice(-3,-1).join(' ').replace(/[-_]/g,' ')||'Geral')}
        if(/^SP\./i.test(n))return 'SP • '+(n.match(/^SP\.(\d+\.\d+)/)?.[1]||'Especialidades');
        if(/^IAM\./i.test(n))return 'Cardiologia • IAM';
        return 'Outros • '+(n.split(/[._-]+/).filter(Boolean)[0]||'Geral');
      }
      function saveSet(key,set){localStorage.setItem(key,JSON.stringify([...set]))}
      function render(){
        const q=search.value.trim().toLocaleLowerCase('pt-BR');
        const visible=tracks.map((t,i)=>({...t,index:i})).filter(t=>(t.name+' '+t.module).toLocaleLowerCase('pt-BR').includes(q)&&(!favoriteFilter||favorites.has(t.key)));
        list.replaceChildren();
        if(!visible.length){status.hidden=false;status.textContent=tracks.length?'Nenhum episódio encontrado.':'Nenhum áudio disponível.';return}
        status.hidden=true;
        const groups=new Map();for(const t of visible){if(!groups.has(t.module))groups.set(t.module,[]);groups.get(t.module).push(t)}
        for(const [module,items] of groups){const details=document.createElement('details');details.className='module';details.open=!!q;const summary=document.createElement('summary');summary.textContent=`${module} `;const count=document.createElement('span');count.className='module-count';count.textContent=`(${items.length} episódios)`;summary.append(count);details.append(summary);
          for(const t of items){const row=document.createElement('div');row.className='audio-row';const play=document.createElement('button');play.type='button';play.className=`play${current===t.index?' current':''}`;play.textContent=`${current===t.index&&!audio.paused?'⏸':'▶'} ${t.name}`;play.addEventListener('click',()=>playTrack(t.index));
            const label=document.createElement('label');label.className='heard';const check=document.createElement('input');check.type='checkbox';check.checked=heard.has(t.key);check.setAttribute('aria-label',`Marcar ${t.name} como ouvido`);check.addEventListener('change',()=>{check.checked?heard.add(t.key):heard.delete(t.key);saveSet('prontuario:heard',heard)});label.append(check,document.createTextNode(' Ouvido'));
            const fav=document.createElement('button');fav.type='button';fav.className=`fav${favorites.has(t.key)?' active':''}`;fav.textContent=favorites.has(t.key)?'♥':'♡';fav.title='Alternar favorito';fav.addEventListener('click',()=>{favorites.has(t.key)?favorites.delete(t.key):favorites.add(t.key);saveSet('prontuario:favorites',favorites);render()});row.append(play,label,fav);details.append(row)}list.append(details)}
      }
      function playTrack(i){if(i<0||i>=tracks.length)return;current=i;const t=tracks[i];audio.src=t.url;$('nowPlaying').textContent=`Reproduzindo: ${t.name}`;$('notes').value=savedNotes[t.key]||'';audio.playbackRate=Number($('speed').value);render();audio.play().catch(err=>{console.error('Falha ao reproduzir áudio:',err);$('nowPlaying').textContent='Não foi possível reproduzir este áudio. Verifique a conexão e tente novamente.'})}
      function skip(seconds){if(Number.isFinite(audio.duration))audio.currentTime=Math.max(0,Math.min(audio.duration,audio.currentTime+seconds))}
      $('playPause').addEventListener('click',()=>{if(current<0){if(tracks.length)playTrack(0);return}if(audio.paused)audio.play().catch(console.error);else audio.pause()});
      audio.addEventListener('play',()=>{$('playPause').textContent='⏸ Pausar';render()});audio.addEventListener('pause',()=>{$('playPause').textContent='▶ Reproduzir';render()});
      audio.addEventListener('timeupdate',()=>{const p=audio.duration?audio.currentTime/audio.duration:0;$('seek').value=Math.round(p*1000);$('pig').style.left=`${p*100}%`;$('currentTime').textContent=fmt(audio.currentTime)});
      audio.addEventListener('loadedmetadata',()=>{$('duration').textContent=fmt(audio.duration)});
      $('seek').addEventListener('input',e=>{if(audio.duration)audio.currentTime=Number(e.target.value)/1000*audio.duration});
      $('back10').addEventListener('click',()=>skip(-10));$('forward30').addEventListener('click',()=>skip(30));
      $('previous').addEventListener('click',()=>{if(current>0)playTrack(current-1)});$('next').addEventListener('click',()=>{if(current+1<tracks.length)playTrack(current+1)});
      audio.addEventListener('ended',()=>{if(current>=0){heard.add(tracks[current].key);saveSet('prontuario:heard',heard);render()}if(continuous&&current+1<tracks.length)playTrack(current+1);else if(continuous&&tracks.length)playTrack(0)});
      $('continuous').addEventListener('click',e=>{continuous=!continuous;e.currentTarget.setAttribute('aria-pressed',String(continuous));e.currentTarget.textContent=continuous?'🔁 Contínuo: sim':'🔁 Contínuo: não'});
      $('speed').addEventListener('change',e=>{audio.playbackRate=Number(e.target.value)});$('volume').addEventListener('input',e=>{audio.volume=Number(e.target.value)});
      $('notes').addEventListener('input',()=>{if(current>=0){savedNotes[tracks[current].key]=$('notes').value;localStorage.setItem('prontuario:notes',JSON.stringify(savedNotes))}});
      search.addEventListener('input',render);$('favoritesOnly').addEventListener('click',e=>{favoriteFilter=!favoriteFilter;e.currentTarget.setAttribute('aria-pressed',String(favoriteFilter));e.currentTarget.textContent=favoriteFilter?'★ Todos':'☆ Favoritos';render()});
      $('theme').addEventListener('click',()=>{document.body.classList.toggle('light');localStorage.setItem('prontuario:theme',document.body.classList.contains('light')?'light':'dark')});if(localStorage.getItem('prontuario:theme')==='light')document.body.classList.add('light');
      fetch(API,{headers:{Accept:'application/vnd.github+json'}}).then(r=>{if(!r.ok)throw Error(`HTTP ${r.status}`);return r.json()}).then(release=>{
        tracks=(release.assets||[]).filter(a=>/\.m4a$/i.test(a.name)).map(a=>({key:a.name,name:a.name.replace(/\.m4a$/i,'').replace(/[._-]+/g,' ').replace(/\s+/g,' ').trim(),module:moduleName(a.name),url:a.browser_download_url})).sort((a,b)=>a.module.localeCompare(b.module,'pt-BR')||a.name.localeCompare(b.name,'pt-BR'));
        status.textContent=tracks.length?'':'Nenhum arquivo M4A encontrado nesta versão.';render();
      }).catch(err=>{console.error('Erro ao carregar áudios:',err);status.textContent='Não foi possível carregar os áudios. Confira sua conexão e tente novamente.'});
    })();
  </script>
</body>
</html>
