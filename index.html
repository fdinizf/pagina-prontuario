<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d1117">
  <title>🎙️ Prontuário Áudio</title>
  <style>
    :root { color-scheme: dark; --bg:#0d1117; --panel:#161b22; --text:#e6edf3; --muted:#8b949e; --accent:#ff9500; --line:#30363d; }
    body.light { color-scheme:light; --bg:#f6f8fa; --panel:#fff; --text:#1f2328; --muted:#656d76; --accent:#bc4c00; --line:#d1d9e0; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
    header { position:sticky; top:0; z-index:2; background:var(--panel); border-bottom:2px solid var(--accent); padding:1rem; }
    .header-inner, main { width:min(1100px,100%); margin:auto; }
    .header-inner { display:flex; align-items:center; justify-content:space-between; gap:1rem; flex-wrap:wrap; }
    h1 { margin:0; font-size:1.35rem; }
    button, input, textarea { font:inherit; }
    button { cursor:pointer; }
    .toolbar { display:flex; gap:.6rem; flex-wrap:wrap; }
    input[type=search] { width:min(340px,70vw); padding:.6rem .8rem; color:var(--text); background:var(--bg); border:1px solid var(--line); border-radius:8px; }
    .btn { padding:.55rem .8rem; border:1px solid var(--accent); border-radius:8px; color:var(--accent); background:transparent; }
    main { padding:1rem; }
    .player, .notes, .audio-list { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:1rem; margin-bottom:1rem; }
    .player { position:sticky; top:90px; z-index:1; }
    #nowPlaying { margin:0 0 .6rem; font-weight:650; }
    audio { display:block; width:100%; }
    .player-actions { display:flex; gap:.5rem; margin-top:.6rem; }
    .status { color:var(--muted); padding:.75rem 0; }
    .audio-row { display:flex; align-items:center; gap:.65rem; border-bottom:1px solid var(--line); padding:.7rem 0; }
    .audio-row:last-child { border-bottom:0; }
    .play { border:0; background:transparent; color:var(--accent); font-size:1rem; text-align:left; flex:1; overflow-wrap:anywhere; }
    .fav { border:0; background:transparent; color:var(--muted); font-size:1.2rem; }
    .fav.active { color:#ff6b6b; }
    textarea { width:100%; min-height:90px; resize:vertical; padding:.7rem; color:var(--text); background:var(--bg); border:1px solid var(--line); border-radius:8px; }
    .small { color:var(--muted); font-size:.85rem; }
    @media(max-width:600px) { .player { top:0; } .header-inner { align-items:flex-start; } }
  </style>
</head>
<body>
  <header><div class="header-inner">
    <h1>🎙️ Prontuário Áudio</h1>
    <div class="toolbar">
      <input id="search" type="search" placeholder="🔍 Buscar áudio..." aria-label="Buscar áudio">
      <button class="btn" id="favoritesOnly" type="button">☆ Favoritos</button>
      <button class="btn" id="theme" type="button" aria-label="Alternar tema">☀️/🌙</button>
    </div>
  </div></header>
  <main>
    <section class="player" aria-label="Reprodutor">
      <p id="nowPlaying">Selecione um áudio para reproduzir</p>
      <audio id="audio" controls preload="none"></audio>
      <div class="player-actions"><button class="btn" id="previous" type="button">⏮ Anterior</button><button class="btn" id="next" type="button">Próximo ⏭</button></div>
    </section>
    <section class="notes"><strong>📝 Anotações do áudio atual</strong><textarea id="notes" placeholder="Suas anotações ficam salvas neste navegador..."></textarea><div class="small">As anotações são armazenadas localmente neste dispositivo.</div></section>
    <section class="audio-list"><strong>Áudios disponíveis</strong><div id="status" class="status">Carregando lista de áudios…</div><div id="list"></div></section>
  </main>
  <script>
    (() => {
      const RELEASE_API = 'https://api.github.com/repos/fdinizf/pagina-prontuario/releases/tags/1.0';
      const audio = document.getElementById('audio');
      const list = document.getElementById('list');
      const status = document.getElementById('status');
      const search = document.getElementById('search');
      const nowPlaying = document.getElementById('nowPlaying');
      const notes = document.getElementById('notes');
      let tracks = [];
      let current = -1;
      let favorites = new Set(JSON.parse(localStorage.getItem('prontuario:favorites') || '[]'));
      let favoriteFilter = false;
      const noteKey = 'prontuario:notes';
      const savedNotes = JSON.parse(localStorage.getItem(noteKey) || '{}');

      function showTracks() {
        const query = search.value.trim().toLocaleLowerCase('pt-BR');
        const visible = tracks.map((track, index) => ({track, index})).filter(({track}) =>
          track.name.toLocaleLowerCase('pt-BR').includes(query) && (!favoriteFilter || favorites.has(track.name))
        );
        list.replaceChildren();
        if (!visible.length) {
          status.hidden = false;
          status.textContent = tracks.length ? 'Nenhum áudio encontrado.' : 'Nenhum áudio disponível nesta versão.';
          return;
        }
        status.hidden = true;
        for (const {track, index} of visible) {
          const row = document.createElement('div'); row.className = 'audio-row';
          const play = document.createElement('button'); play.type = 'button'; play.className = 'play';
          play.textContent = `${current === index && !audio.paused ? '⏸' : '▶'} ${track.name}`;
          play.addEventListener('click', () => playTrack(index));
          const fav = document.createElement('button'); fav.type = 'button'; fav.className = `fav${favorites.has(track.name) ? ' active' : ''}`;
          fav.textContent = favorites.has(track.name) ? '♥' : '♡'; fav.title = 'Alternar favorito';
          fav.setAttribute('aria-label', `Favoritar ${track.name}`);
          fav.addEventListener('click', () => {
            favorites.has(track.name) ? favorites.delete(track.name) : favorites.add(track.name);
            localStorage.setItem('prontuario:favorites', JSON.stringify([...favorites])); showTracks();
          });
          row.append(play, fav); list.append(row);
        }
      }
      function playTrack(index) {
        if (index < 0 || index >= tracks.length) return;
        current = index; const track = tracks[index];
        audio.src = track.url; nowPlaying.textContent = `Reproduzindo: ${track.name}`;
        notes.value = savedNotes[track.name] || ''; showTracks();
        audio.play().catch(error => { nowPlaying.textContent = `Não foi possível reproduzir “${track.name}”. Verifique sua conexão e tente novamente.`; console.error(error); });
      }
      notes.addEventListener('input', () => {
        if (current >= 0) { savedNotes[tracks[current].name] = notes.value; localStorage.setItem(noteKey, JSON.stringify(savedNotes)); }
      });
      audio.addEventListener('ended', () => { if (current + 1 < tracks.length) playTrack(current + 1); });
      document.getElementById('previous').addEventListener('click', () => { if (current > 0) playTrack(current - 1); });
      document.getElementById('next').addEventListener('click', () => { if (current + 1 < tracks.length) playTrack(current + 1); });
      search.addEventListener('input', showTracks);
      document.getElementById('favoritesOnly').addEventListener('click', event => {
        favoriteFilter = !favoriteFilter; event.currentTarget.textContent = favoriteFilter ? '★ Todos' : '☆ Favoritos'; showTracks();
      });
      document.getElementById('theme').addEventListener('click', () => {
        document.body.classList.toggle('light'); localStorage.setItem('prontuario:theme', document.body.classList.contains('light') ? 'light' : 'dark');
      });
      if (localStorage.getItem('prontuario:theme') === 'light') document.body.classList.add('light');

      fetch(RELEASE_API, {headers: {Accept: 'application/vnd.github+json'}})
        .then(response => { if (!response.ok) throw new Error(`GitHub respondeu com HTTP ${response.status}`); return response.json(); })
        .then(release => {
          tracks = (release.assets || []).filter(asset => /\.m4a$/i.test(asset.name))
            .map(asset => ({name: asset.name.replace(/\.m4a$/i, '').replace(/[._-]+/g, ' '), url: asset.browser_download_url}));
          tracks.sort((a, b) => a.name.localeCompare(b.name, 'pt-BR'));
          status.textContent = tracks.length ? '' : 'A versão foi encontrada, mas não contém arquivos M4A.';
          showTracks();
        })
        .catch(error => {
          status.textContent = 'Não foi possível carregar os áudios. Confira sua conexão ou tente novamente mais tarde.';
          console.error('Erro ao carregar a lista de áudios:', error);
        });
    })();
  </script>
</body>
</html>
