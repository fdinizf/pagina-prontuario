<!DOCTYPE html> <html lang="pt-BR"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>🎙️ Prontuário Áudio</title> <style> * { margin: 0; padding: 0; box-sizing: border-box; } :root { --bg: #0d1117; --bg2: #161b22; --txt: #e6edf3; --txt2: #8b949e; --accent: #ff9500; --accent2: #ffd700; --blue: #58a6ff; --red: #ff6b6b; } body.light { --bg: #fff; --bg2: #f6f8fa; --txt: #0d1117; --txt2: #57606a; } body { font-family: Segoe UI, sans-serif; background: var(--bg); color: var(--txt); } header { background: var(--bg2); padding: 1rem; border-bottom: 2px solid var(--accent); position: sticky; top: 0; z-index: 100; } .header { max-width: 1400px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; } .title { display: flex; align-items: center; gap: 0.5rem; font-size: 1.3rem; font-weight: bold; } .controls { display: flex; gap: 1rem; } .search { background: var(--bg); border: 2px solid var(--blue); border-radius: 25px; padding: 0.6rem 1rem; color: var(--txt); width: 200px; } .theme-btn { background: 0; border: 2px solid var(--accent2); color: var(--accent2); padding: 0.5rem 0.8rem; border-radius: 20px; cursor: pointer; font-size: 1rem; } .container { max-width: 1400px; margin: 0 auto; padding: 1.5rem; display: flex; gap: 1.5rem; } .sidebar { flex: 0 0 250px; border-right: 2px solid var(--accent); } .main { flex: 1; } .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; margin-bottom: 1.5rem; } .stat { background: var(--bg2); border-left: 3px solid var(--accent); padding: 0.8rem; border-radius: 5px; text-align: center; } .stat-num { font-size: 1.5rem; color: var(--accent); font-weight: bold; } .stat-label { font-size: 0.75rem; color: var(--txt2); } .tabs { display: flex; flex-direction: column; gap: 0.3rem; } .tab-btn { background: var(--bg2); border: none; color: var(--txt); padding: 0.6rem; border-radius: 5px; cursor: pointer; transition: all 0.3s; } .tab-btn:hover, .tab-btn.active { background: var(--accent); color: var(--bg); } .categories { display: grid; gap: 1rem; } .cat-section { background: var(--bg2); border: 2px solid var(--accent); border-radius: 8px; overflow: hidden; } .cat-header { background: linear-gradient(135deg, var(--accent), var(--accent2)); padding: 1rem; cursor: pointer; display: flex; justify-content: space-between; color: var(--bg); font-weight: bold; user-select: none; } .cat-header:hover { transform: translateX(3px); } .subcats { max-height: 0; overflow: hidden; transition: max-height 0.3s; } .subcats.open { max-height: 2000px; } .subcat { border-bottom: 1px solid rgba(255, 149, 0, 0.2); } .subcat-header { padding: 0.8rem 1.2rem; background: rgba(255, 149, 0, 0.1); cursor: pointer; font-weight: 600; color: var(--accent); display: flex; justify-content: space-between; user-select: none; } .subcat-header:hover { background: rgba(255, 149, 0, 0.2); } .audios { max-height: 0; overflow: hidden; transition: max-height 0.3s; } .audios.open { max-height: 1500px; } .audio-item { padding: 0.6rem 1.5rem; cursor: pointer; display: flex; align-items: center; gap: 0.6rem; transition: all 0.3s; border-bottom: 1px solid rgba(255, 255, 255, 0.05); } .audio-item:hover { background: rgba(255, 149, 0, 0.1); padding-left: 1.8rem; } .audio-item.active { background: rgba(88, 166, 255, 0.2); border-left: 3px solid var(--blue); } .audio-title { flex: 1; font-size: 0.9rem; } .fav-btn { background: 0; border: 0; cursor: pointer; font-size: 1rem; color: var(--txt2); transition: all 0.3s; } .fav-btn:hover, .fav-btn.fav { color: var(--red); } .player-section { background: linear-gradient(135deg, var(--bg2), rgba(255, 149, 0, 0.1)); border: 2px solid var(--accent); border-radius: 12px; padding: 1.5rem; display: none; } .now-playing-title { font-size: 0.75rem; color: var(--txt2); text-transform: uppercase; } .now-playing-name { font-size: 1.3rem; font-weight: bold; color: var(--accent); } .now-playing-cat { font-size: 0.85rem; color: var(--txt2); } .progress-container { margin: 1rem 0; } .progress-bar { width: 100%; height: 6px; background: var(--bg); border-radius: 10px; cursor: pointer; position: relative; border: 1px solid var(--accent); } .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 10px; } .progress-slider { position: absolute; top: 50%; left: 0; transform: translate(-50%, -50%); width: 20px; height: 20px; background: var(--bg); border: 2px solid var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1rem; cursor: grab; } .time-display { display: flex; justify-content: space-between; margin-top: 0.5rem; font-size: 0.8rem; color: var(--txt2); } .controls-player { display: flex; justify-content: center; align-items: center; gap: 1rem; margin: 1rem 0; } .control-btn { background: 0; border: 2px solid var(--accent); color: var(--accent); width: 45px; height: 45px; border-radius: 50%; cursor: pointer; font-size: 1.2rem; transition: all 0.3s; display: flex; align-items: center; justify-content: center; } .control-btn:hover { background: var(--accent); color: var(--bg); } .play-btn { width: 60px; height: 60px; font-size: 1.5rem; background: var(--accent); color: var(--bg); } .volume-control { display: flex; align-items: center; gap: 0.5rem; } .volume-slider { width: 80px; height: 5px; cursor: pointer; } .notes-section { background: var(--bg2); border-left: 3px solid var(--accent); padding: 1rem; border-radius: 5px; margin: 1rem 0; } .notes-title { font-weight: bold; color: var(--accent); margin-bottom: 0.5rem; } textarea { width: 100%; height: 100px; background: var(--bg); border: 2px solid var(--accent); border-radius: 5px; padding: 0.5rem; color: var(--txt); font-family: inherit; resize: vertical; } textarea:focus { outline: 0; box-shadow: 0 0 10px var(--accent); } .history-section, .favorites-section { background: var(--bg2); border-left: 3px solid var(--accent); padding: 1rem; border-radius: 5px; margin: 1rem 0; } .section-title { font-weight: bold; color: var(--accent); margin-bottom: 0.8rem; display: flex; justify-content: space-between; } .list-item { background: var(--bg); padding: 0.6rem; border-radius: 3px; margin-bottom: 0.5rem; cursor: pointer; border-left: 2px solid var(--accent); padding-left: 0.7rem; transition: all 0.3s; } .list-item:hover { background: rgba(255, 149, 0, 0.1); transform: translateX(2px); } .item-title { font-size: 0.85rem; font-weight: 500; } .item-time { font-size: 0.7rem; color: var(--txt2); } .empty-msg { text-align: center; color: var(--txt2); padding: 1rem; font-style: italic; } .clear-btn { background: 0; border: 1px solid var(--accent); color: var(--accent); padding: 0.3rem 0.6rem; border-radius: 3px; cursor: pointer; font-size: 0.75rem; } .clear-btn:hover { background: var(--accent); color: var(--bg); } .loading { text-align: center; padding: 3rem; color: var(--accent); font-size: 1.5rem; } @media (max-width: 768px) { .container { flex-direction: column; } .sidebar { flex: 1; border-right: 0; border-bottom: 2px solid var(--accent); } } ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: var(--bg2); } ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 5px; } </style> </head> <body> <header> <div class="header"> <div class="title"><span>🎙️</span><span>Prontuário</span></div> <div class="controls"> <input type="text" id="search" class="search" placeholder="🔍 Buscar..."> <button class="theme-btn" id="theme">🌙</button> </div> </div> </header> <div class="container"> <aside class="sidebar"> <div> <div style="font-weight: bold; color: var(--accent); margin-bottom: 0.8rem;">📊 Estatísticas</div> <div class="stats"> <div class="stat"><div class="stat-num" id="total">0</div><div class="stat-label">Total</div></div> <div class="stat"><div class="stat-num" id="favs">0</div><div class="stat-label">Favoritos</div></div> </div> </div> <div style="margin-top: 1.5rem;"> <div style="font-weight: bold; color: var(--accent); margin-bottom: 0.8rem;">📂 Navegação</div> <div class="tabs"> <button class="tab-btn active" data-tab="all">📁 Todos</button> <button class="tab-btn" data-tab="fav">❤️ Favoritos</button> <button class="tab-btn" data-tab="hist">🕐 Histórico</button> </div> </div> </aside> <main class="main"> <section class="player-section" id="player"> <div> <div class="now-playing-title">▶️ Reproduzindo</div> <div class="now-playing-name" id="pname">Selecione um áudio</div> <div class="now-playing-cat" id="pcat"></div> </div> <audio id="audio"></audio> <div class="progress-container"> <div class="progress-bar" id="pb"> <div class="progress-fill" id="pf"></div> <div class="progress-slider" id="ps">🐷</div> </div> <div class="time-display"><span id="ct">0:00</span><span id="dur">0:00</span></div> </div> <div class="controls-player"> <button class="control-btn" id="prev">⏮️</button> <button class="control-btn play-btn" id="play">▶️</button> <button class="control-btn" id="next">⏭️</button> <div class="volume-control"><span>🔊</span><input type="range" id="vol" min="0" max="100" value="100" class="volume-slider"></div> </div> <div class="notes-section"> <div class="notes-title">📝 Anotações</div> <textarea id="notes" placeholder="Adicione suas anotações..."></textarea> </div> <div class="history-section"> <div class="section-title">🕐 Histórico <button class="clear-btn" id="clrh">Limpar</button></div> <div id="histlist"><div class="empty-msg">Nenhum áudio ouvido</div></div> </div> <div class="favorites-section"> <div class="section-title">❤️ Favoritos</div> <div id="favlist"><div class="empty-msg">Sem favoritos</div></div> </div> </section> <section class="categories" id="cats"><div class="loading">⏳ Carregando áudios...</div></section> </main> </div> <script> // ============ DADOS COMPLETOS ============ const DATA = { baseUrl: "https://github.com/fdinizf/pagina-prontuario/releases/download/1.0/", categorias: [ { id: "raiz", nome: "📁 Raiz", subcategorias: [ { id: "cardio", nome: "Cardiologia", audios: [ { id: "a1", titulo: "IAM conceito e classificação", arquivo: "IAM.conceito.e.classificacao.-.5.Consenso.ESC.IAM.2026.m4a", categoria: "Cardiologia", subcategoria: "Cardiologia" }, { id: "a2", titulo: "IAM ECG, laboratório e imagem", arquivo: "IAM.ECG.laboratorio.e.imagem.-.5.Consenso.ESC.IAM.2026.m4a", categoria: "Cardiologia", subcategoria: "Cardiologia" } ] }, { id: "peds", nome: "Pediatria", audios: [ { id: "a3", titulo: "Obstrução de vias aéreas", arquivo: "Obstrucao.de.vias.aereas.na.pediatria.m4a", categoria: "Pediatria", subcategoria: "Pediatria" } ] } ] }, { id: "hmec", nome: "📁 HMEC", subcategorias: [ { id: "pcr", nome: "BLS/ACLS 2025", audios: [ { id: "a4", titulo: "BLS AHA 2025", arquivo: "HMEC.-.BLS.AHA.2025.m4a", categoria: "HMEC", subcategoria: "BLS/ACLS" }, { id: "a5", titulo: "ACLS Parte 1", arquivo: "HMEC.-.ACLS.AHA.2025.-.Parte.1.m4a", categoria: "HMEC", subcategoria: "BLS/ACLS" }, { id: "a6", titulo: "ACLS Parte 2 - Arritmias", arquivo: "HMEC.-.ACLS.AHA.2025.-.Parte.2.-.Arritimias.m4a", categoria: "HMEC", subcategoria: "BLS/ACLS" }, { id: "a7", titulo: "Farmacologia PCR", arquivo: "HMEC.-.Farmacologia_da_parada_cardiaca_no_ACLS_2025.m4a", categoria: "HMEC", subcategoria: "BLS/ACLS" }, { id: "a8", titulo: "Cuidados pós-PCR", arquivo: "HMEC.-.Cuidados.pos-PCR.m4a", categoria: "HMEC", subcategoria: "BLS/ACLS" }, { id: "a9", titulo: "Salvando cérebro pós-PCR", arquivo: "HMEC.-.Salvando.cerebro.pos-PRC.m4a", categoria: "HMEC", subcategoria: "BLS/ACLS" } ] }, { id: "sep", nome: "Sepse", audios: [ { id: "a10", titulo: "Sepse pt. 1", arquivo: "HMEC.-.Sepse.-.pt.1.m4a", categoria: "HMEC", subcategoria: "Sepse" }, { id: "a11", titulo: "Sepse pt. 2", arquivo: "HMEC.-.Sepse.-.pt.2.m4a", categoria: "HMEC", subcategoria: "Sepse" } ] }, { id: "toxo", nome: "Toxicologia", audios: [ { id: "a12", titulo: "Abordagem geral intoxicações", arquivo: "Abordagem.geral.das.intoxicacoes.m4a", categoria: "HMEC", subcategoria: "Toxicologia" }, { id: "a13", titulo: "Intoxicação - Álcoois", arquivo: "Intoxicacao.-.alcoois.m4a", categoria: "HMEC", subcategoria: "Toxicologia" }, { id: "a14", titulo: "Intoxicação - CO e cianeto", arquivo: "Intoxicacao.-.CO.e.cianeto.m4a", categoria: "HMEC", subcategoria: "Toxicologia" }, { id: "a15", titulo: "Intoxicação - Opioides, Paracetamol, etc", arquivo: "Intoxicacao.-.Opioides.Paracetamol.Antidepressivos.Triciclicos.Benzodiazepinicos.e.Antiarritmicos.m4a", categoria: "HMEC", subcategoria: "Toxicologia" }, { id: "a16", titulo: "Intoxicação - Simpaticomimét. e Anticolinérgicos", arquivo: "Intoxicacao.-.Simpaticomimeticos.Anticolinergicos.e.a.Tempestade.Colinergica.m4a", categoria: "HMEC", subcategoria: "Toxicologia" } ] }, { id: "neuro", nome: "Neurologia", audios: [ { id: "a17", titulo: "Crise convulsiva", arquivo: "Crise.convulsiva.m4a", categoria: "HMEC", subcategoria: "Neurologia" } ] } ] }, { id: "toce", nome: "📁 TOCE", subcategorias: [ { id: "abd", nome: "Abdome Agudo", audios: [ { id: "a18", titulo: "Abdome agudo pt 1", arquivo: "TOCE.-.abdome.agudo.parte.1.m4a", categoria: "TOCE", subcategoria: "Abdome" }, { id: "a19", titulo: "Abdome agudo pt 2", arquivo: "TOCE.-.abdome.agudo.parte.2.m4a", categoria: "TOCE", subcategoria: "Abdome" }, { id: "a20", titulo: "Abdome obstrutivo", arquivo: "TOCE.-.Adbome.obstrutivo.m4a", categoria: "TOCE", subcategoria: "Abdome" }, { id: "a21", titulo: "Abdome isquêmico", arquivo: "TOCE-.abdome.isquemico.m4a", categoria: "TOCE", subcategoria: "Abdome" }, { id: "a22", titulo: "Volvo sigmóide", arquivo: "TOCE.-.Volvo.sigmoide.m4a", categoria: "TOCE", subcategoria: "Abdome" } ] } ] }, { id: "pmsus", nome: "📁 PMSUS", subcategorias: [ { id: "hipert", nome: "Hipertensão", audios: [ { id: "a23", titulo: "Diretriz Brasil 2025 e AHA 2026", arquivo: "PMSUS.-.Diretriz.Brasileira.2025.e.AHA.2026.m4a", categoria: "PMSUS", subcategoria: "Hipertensão" } ] } ] }, { id: "ncs1", nome: "📁 NCS Complexo 1", subcategorias: [ { id: "arr", nome: "Arritmias", audios: [ { id: "a24", titulo: "Abordagem das arritmias", arquivo: "NCS.-.SP.1.1.-.Abordagem.das.arritmias.m4a", categoria: "NCS", subcategoria: "Arritmias" }, { id: "a25", titulo: "FA Parte 1", arquivo: "NCS.-.SP.1.1.-.FA.parte.1.m4a", categoria: "NCS", subcategoria: "Arritmias" } ] } ] } ] }; // ============ APP STATE ============ const app = { audios: [], fav: [], hist: [], notes: {}, current: null, playing: false, currentTab: 'all' }; // ============ DOM ELEMENTS ============ const els = { audio: document.getElementById("audio"), play: document.getElementById("play"), prev: document.getElementById("prev"), next: document.getElementById("next"), vol: document.getElementById("vol"), pb: document.getElementById("pb"), pf: document.getElementById("pf"), ps: document.getElementById("ps"), ct: document.getElementById("ct"), dur: document.getElementById("dur"), pname: document.getElementById("pname"), pcat: document.getElementById("pcat"), notes: document.getElementById("notes"), search: document.getElementById("search"), theme: document.getElementById("theme"), player: document.getElementById("player"), cats: document.getElementById("cats"), clrh: document.getElementById("clrh"), histlist: document.getElementById("histlist"), favlist: document.getElementById("favlist"), total: document.getElementById("total"), favs: document.getElementById("favs") }; // ============ INIT ============ document.addEventListener("DOMContentLoaded", () => { console.log("🎙️ Carregando Prontuário Áudio..."); load(); init(); attachListeners(); render(); updateStats(); console.log("✅ Carregado com sucesso!"); }); // ============ FUNCTIONS ============ function load() { const s = localStorage.getItem("aud"); if (s) { const o = JSON.parse(s); app.fav = o.fav || []; app.hist = o.hist || []; app.notes = o.notes || {}; } } function save() { localStorage.setItem("aud", JSON.stringify({ fav: app.fav, hist: app.hist, notes: app.notes })); } function init() { app.audios = []; DATA.categorias.forEach(c => c.subcategorias.forEach(s => app.audios.push(...s.audios))); console.log("Total de áudios:", app.audios.length); const t = localStorage.getItem("theme") || "dark"; if (t === "light") { document.body.classList.add("light"); els.theme.textContent = "☀️"; } } function attachListeners() { els.play.addEventListener("click", () => { if (!app.current) return; app.playing ? pause3() : play3(); }); els.prev.addEventListener("click", prev3); els.next.addEventListener("click", next3); els.vol.addEventListener("input", e => { els.audio.volume = e.target.value / 100; }); els.pb.addEventListener("click", e => { const rect = els.pb.getBoundingClientRect(); const pct = (e.clientX - rect.left) / rect.width; els.audio.currentTime = pct * els.audio.duration; }); els.audio.addEventListener("timeupdate", () => { const pct = (els.audio.currentTime / els.audio.duration) * 100; els.pf.style.width = pct + "%"; els.ps.style.left = pct + "%"; els.ct.textContent = fmt(els.audio.currentTime); }); els.audio.addEventListener("loadedmetadata", () => { els.dur.textContent = fmt(els.audio.duration); }); els.audio.addEventListener("ended", next3); els.notes.addEventListener("input", () => { if (app.current) app.notes[app.current.id] = els.notes.value; save(); }); els.search.addEventListener("input", handleSearch); els.theme.addEventListener("click", toggleTheme); els.clrh.addEventListener("click", clearHist); document.querySelectorAll(".tab-btn").forEach(btn => { btn.addEventListener("click", e => { document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active")); e.target.classList.add("active"); app.currentTab = e.target.dataset.tab; render(); }); }); } function render() { if (app.currentTab === "all") { renderCategories(); } else if (app.currentTab === "fav") { renderFavorites(); } else if (app.currentTab === "hist") { renderHistory(); } } function renderCategories() { if (app.audios.length === 0) { els.cats.innerHTML = "<div class='loading'>Sem áudios</div>"; return; } const html = DATA.categorias.map(c => { const html2 = c.subcategorias.map(s => ` <div class="subcat"> <div class="subcat-header" onclick="tog(this)"> ${s.nome} <span>▶</span> </div> <div class="audios"> ${s.audios.map(a => ` <div class="audio-item ${app.current?.id === a.id ? "active" : ""}" onclick="play2('${a.id}')"> <span>🎵</span> <span class="audio-title">${a.titulo}</span> <button class="fav-btn ${app.fav.includes(a.id) ? "fav" : ""}" onclick="fav(event, '${a.id}')"> ${app.fav.includes(a.id) ? "❤️" : "🤍"} </button> </div> `).join("")} </div> </div> `).join(""); return ` <div class="cat-section"> <div class="cat-header" onclick="tog(this)"> ${c.nome} <span>▼</span> </div> <div class="subcats"> ${html2} </div> </div> `; }).join(""); els.cats.innerHTML = html; } function renderFavorites() { if (app.fav.length === 0) { els.cats.innerHTML = "<div class='loading'>Nenhum favorito</div>"; return; } const html = app.fav.map(id => { const a = app.audios.find(x => x.id === id); return a ? `<div class="list-item" onclick="play2('${id}')">${a.titulo}</div>` : ""; }).join(""); els.cats.innerHTML = html; } function renderHistory() { if (app.hist.length === 0) { els.cats.innerHTML = "<div class='loading'>Sem histórico</div>"; return; } const html = app.hist.map(h => ` <div class="list-item" onclick="play2('${h.id}')"> <div class="item-title">${h.titulo}</div> <div class="item-time">${h.time}</div> </div> `).join(""); els.cats.innerHTML = html; } function tog(e) { const next = e.nextElementSibling; if (next) { next.classList.toggle("open"); if (e.querySelector("span")) { e.querySelector("span").style.transform = next.classList.contains("open") ? "rotate(180deg)" : "rotate(0deg)"; } } } function play2(id) { const a = app.audios.find(x => x.id === id); if (!a) return; app.current = a; els.audio.src = DATA.baseUrl + a.arquivo; els.pname.textContent = a.titulo; els.pcat.textContent = a.categoria + " • " + a.subcategoria; els.player.style.display = "block"; els.notes.value = app.notes[id] || ""; play3(); addHist(a); } function play3() { els.audio.play(); app.playing = true; els.play.textContent = "⏸️"; } function pause3() { els.audio.pause(); app.playing = false; els.play.textContent = "▶️"; } function prev3() { const i = app.audios.findIndex(x => x.id === app.current?.id); if (i > 0) play2(app.audios[i - 1].id); } function next3() { const i = app.audios.findIndex(x => x.id === app.current?.id); if (i < app.audios.length - 1) play2(app.audios[i + 1].id); } function fmt(sec) { if (!sec || isNaN(sec)) return "0:00"; const m = Math.floor(sec / 60); const s = Math.floor(sec % 60); return m + ":" + (s < 10 ? "0" : "") + s; } function addHist(a) { app.hist = app.hist.filter(h => h.id !== a.id); app.hist.unshift({ id: a.id, titulo: a.titulo, time: new Date().toLocaleTimeString("pt-BR") }); if (app.hist.length > 20) app.hist.pop(); save(); } function fav(e, id) { e.stopPropagation(); const i = app.fav.indexOf(id); if (i > -1) app.fav.splice(i, 1); else app.fav.push(id); save(); updateStats(); renderCategories(); } function handleSearch(e) { const q = e.target.value.toLowerCase(); if (!q) { render(); return; } const filtered = app.audios.filter(a => a.titulo.toLowerCase().includes(q) || a.categoria.toLowerCase().includes(q)); els.cats.innerHTML = filtered.map(a => `<div class="list-item" onclick="play2('${a.id}')">${a.titulo}</div>`).join("") || "<div class='empty-msg'>Não encontrado</div>"; } function toggleTheme() { document.body.classList.toggle("light"); const isLight = document.body.classList.contains("light"); localStorage.setItem("theme", isLight ? "light" : "dark"); els.theme.textContent = isLight ? "☀️" : "🌙"; } function clearHist() { if (confirm("Limpar histórico?")) { app.hist = []; save(); renderHistory(); } } function updateStats() { els.total.textContent = app.audios.length; els.favs.textContent = app.fav.length; const flist = app.fav.map(id => { const a = app.audios.find(x => x.id === id); return a ? `<div class="list-item" onclick="play2('${id}')">${a.titulo}</div>` : ""; }).join(""); els.favlist.innerHTML = flist || "<div class='empty-msg'>Sem favoritos</div>"; } </script> </body> </html>
