<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d1117">
  <title>🎙️ R.A.P.I.D.I.M</title>
  <style>
    :root{color-scheme:dark;--bg:#0d1117;--panel:#161b22;--text:#e6edf3;--muted:#8b949e;--accent:#ff9500;--line:#30363d}
    body.light{color-scheme:light;--bg:#f6f8fa;--panel:#fff;--text:#1f2328;--muted:#656d76;--accent:#bc4c00;--line:#d1d9e0}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}header{position:sticky;top:0;z-index:3;background:var(--panel);border-bottom:2px solid var(--accent);padding:1rem}.header-inner,main{width:min(1100px,100%);margin:auto}.header-inner{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}h1{margin:0;font-size:1.35rem}button,input,textarea,select{font:inherit}button{cursor:pointer}.toolbar,.controls{display:flex;gap:.55rem;align-items:center;flex-wrap:wrap}.toolbar input{width:min(330px,68vw);padding:.55rem .75rem;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px}.btn{padding:.5rem .75rem;border:1px solid var(--accent);border-radius:8px;color:var(--accent);background:transparent}.btn[aria-pressed=true]{background:var(--accent);color:var(--bg)}main{padding:1rem}.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:1rem;margin-bottom:1rem}.player{position:sticky;top:88px;z-index:2}.now{font-weight:650;margin:0 0 .4rem}.seek-wrap{height:42px;position:relative;display:flex;align-items:center;margin:.2rem .5rem}.seek{appearance:none;-webkit-appearance:none;width:100%;height:8px;border-radius:8px;outline:none;cursor:pointer;margin:0;background:linear-gradient(to right,var(--accent) 0%,var(--accent) var(--progress,0%),var(--line) var(--progress,0%),var(--line) 100%)}.seek::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;width:32px;height:34px;background:transparent;border:0}.seek::-moz-range-thumb{width:32px;height:34px;background:transparent;border:0}.pig{position:absolute;left:0;top:50%;transform:translate(-50%,-50%);font-size:27px;line-height:1;pointer-events:none;z-index:1}.times{display:flex;justify-content:space-between;color:var(--muted);font-size:.8rem;margin-top:-.15rem}.controls{justify-content:center;margin:.6rem 0}.speed{color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:.45rem}.volume{width:90px;accent-color:var(--accent)}.status{color:var(--muted);padding:.75rem 0}.module{border:1px solid var(--line);border-radius:8px;margin:.7rem 0;overflow:hidden}.module>summary,.submodule>summary{cursor:pointer;padding:.75rem 1rem;background:var(--panel);font-weight:650}.submodule{border-top:1px solid var(--line)}.submodule>summary{padding:.6rem 1rem .6rem 1.5rem;background:color-mix(in srgb,var(--panel),var(--accent) 7%);font-weight:550}.module-count{color:var(--muted);font-weight:400;font-size:.85rem}.audio-row{display:flex;align-items:center;gap:.55rem;border-top:1px solid var(--line);padding:.6rem .8rem .6rem 2rem}.play{border:0;background:transparent;color:var(--text);text-align:left;flex:1;overflow-wrap:anywhere}.play.current{color:var(--accent)}.heard{white-space:nowrap;color:var(--muted);font-size:.82rem}.heard input{accent-color:var(--accent)}.fav{border:0;background:transparent;color:var(--muted);font-size:1.2rem}.fav.active{color:#ff6b6b}textarea{width:100%;min-height:75px;resize:vertical;padding:.65rem;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px}.small{font-size:.82rem;color:var(--muted)}@media(max-width:600px){.player{top:0}.header-inner{align-items:flex-start}.controls .btn{padding:.4rem .55rem}.audio-row{padding-left:1rem}}
  </style>
</head>
<body>
  <header><div class="header-inner"><h1>🎙️ R.A.P.I.D.I.M</h1><div class="toolbar"><input id="search" type="search" placeholder="🔍 Buscar áudio ou assunto…" aria-label="Buscar áudio"><button class="btn" id="favoritesOnly" type="button" aria-pressed="false">☆ Favoritos</button><button class="btn" id="theme" type="button" aria-label="Alternar tema">☀️/🌙</button></div></div></header>
  <main>
    <section class="panel player" aria-label="Reprodutor de áudio">
      <p class="now" id="nowPlaying">Selecione um áudio para reproduzir</p><audio id="audio" preload="metadata"></audio>
      <div class="seek-wrap"><span class="pig" id="pig" aria-hidden="true">🐷</span><input class="seek" id="seek" type="range" min="0" max="1000" value="0" aria-label="Posição do áudio"><div class="times"><span id="currentTime">0:00</span><span id="duration">0:00</span></div></div>
      <div class="controls"><button class="btn" id="previous" type="button" aria-label="Áudio anterior">⏮</button><button class="btn" id="back10" type="button">↶ 10 s</button><button class="btn" id="playPause" type="button">▶ Reproduzir</button><button class="btn" id="forward30" type="button">30 s ↷</button><button class="btn" id="next" type="button" aria-label="Próximo áudio">⏭</button><button class="btn" id="continuous" type="button" aria-pressed="false">🔁 Contínuo: não</button><label class="small" for="speed">Velocidade</label><select class="speed" id="speed" aria-label="Velocidade de reprodução"><option value="1">1,0×</option><option value="1.25">1,25×</option><option value="1.5">1,5×</option><option value="1.8">1,8×</option><option value="2">2,0×</option></select><label class="small" for="volume">🔊</label><input class="volume" id="volume" type="range" min="0" max="1" step="0.05" value="1" aria-label="Volume"></div>
    </section>
    <section class="panel"><strong>📝 Anotações do áudio atual</strong><textarea id="notes" placeholder="Suas anotações ficam salvas neste navegador..."></textarea><div class="small">Salvas localmente neste dispositivo.</div></section>
    <section class="panel"><strong>📚 Módulos e episódios</strong><div id="status" class="status">Carregando áudios…</div><div id="list"></div></section>
  </main>
  <script>
    (()=>{
      const API='https://api.github.com/repos/fdinizf/pagina-prontuario/releases/tags/1.0';
      const $=id=>document.getElementById(id),audio=$('audio'),search=$('search'),list=$('list'),status=$('status');
      let tracks=[],current=-1,favoriteFilter=false,continuous=false;
      const read=(key,fallback)=>{try{return JSON.parse(localStorage.getItem(key))??fallback}catch{return fallback}};
      const favorites=new Set(read('prontuario:favorites',[])),heard=new Set(read('prontuario:heard',[])),savedNotes=read('prontuario:notes',{});
      const fileKey=s=>s.toLocaleLowerCase('pt-BR').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');
      const prettyOverrides={
        'abordagemgeraldasintoxicacoes':'Abordagem geral das intoxicações',
        'intoxicacaoalcoois':'Intoxicação - álcoois','intoxicacaocoe cianeto':'Intoxicação - CO e cianeto',
        'criseconvulsiva':'Crise convulsiva','obstrucaodeviasaereasnapediatria':'Obstrução de vias aéreas na pediatria',
        'asarmadilhasfisiologicasd neonatal':'As Armadilhas Fisiológicas da Cirurgia Neonatal'
      };
      function titleFor(file){
        const raw=file.replace(/\.m4a$/i,'');
        const exact={
          'HMEC.-.BLS.AHA.2025':'HMEC - BLS AHA 2025','HMEC.-.ACLS.AHA.2025.-.Parte.1':'HMEC - ACLS AHA 2025 - Parte 1','HMEC.-.ACLS.AHA.2025.-.Parte.2.-.Arritimias':'HMEC - ACLS AHA 2025 - Parte 2 - Arritmias',
          'HMEC.-.Farmacologia_da_parada_cardiaca_no_ACLS_2025':'HMEC - Farmacologia da parada cardíaca no ACLS 2025','HMEC.-.Cuidados.pos-PCR':'HMEC - Cuidados pós-PCR','HMEC.-.Salvando.cerebro.pos-PRC':'HMEC - Salvando cérebro pós-PCR',
          'HMEC.-.Sepse.-.pt.1':'HMEC - Sepse - pt. 1','HMEC.-.Sepse.-.pt.2':'HMEC - Sepse - pt. 2',
          'IAM.conceito.e.classificacao.-.5.Consenso.ESC.IAM.2026':'IAM conceito e classificação - 5º Consenso ESC IAM 2026','IAM.ECG.laboratorio.e.imagem.-.5.Consenso.ESC.IAM.2026':'IAM ECG, laboratório e imagem - 5º Consenso ESC IAM 2026',
          'TOCE.-.abdome.agudo.parte.1':'TOCE - abdome agudo parte 1','TOCE.-.abdome.agudo.parte.2':'TOCE - abdome agudo parte 2','TOCE.-.Adbome.obstrutivo':'TOCE - Abdome obstrutivo','TOCE-.abdome.isquemico':'TOCE - Abdome isquêmico','TOCE.-.Volvo.sigmoide':'TOCE - Volvo sigmóide',
          'TOCE.-.Apendicite_aguda_no_pronto-socorro':'TOCE - Apendicite aguda no pronto-socorro','TOCE.-.Manejo.de.apendicite':'TOCE - Manejo de apendicite','TOCE.-.Colecistite.aguda.calculosa.X.acalculosa':'TOCE - Colecistite aguda calculosa X acalculosa','TOCE.-.Manejo.de.colecisite.aguda':'TOCE - Manejo de colecistite aguda',
          'TOCE.-.Diverticulite.-.conceito.e.fisiopatologia':'TOCE - Diverticulite - conceito e fisiopatologia','TOCE.-.Diverticulite.-.Triagem.e.manejo.ambulatorial':'TOCE - Diverticulite - Triagem e manejo ambulatorial','TOCE.-.Diverticulite.-.Manejo.cirurgico':'TOCE - Diverticulite - Manejo cirúrgico',
          'TOCE.-.Fisiopatologia.e.etiologias.da.Pancreatite.aguda':'TOCE - Fisiopatologia e etiologias da pancreatite aguda','TOCE.-.Sintomas.e.diagnostico.da.Pancreatite.aguda_':'TOCE - Sintomas e diagnóstico da pancreatite aguda','TOCE.-.Manejo.e.abordagem.da.pancreatite.aguda':'TOCE - Manejo e abordagem da pancreatite aguda',
          'TOCE.-.Hemorragia_digestiva_baixa_na_emergencia':'TOCE - Hemorragia digestiva baixa na emergência','TOCE.-.Manejo_da_Hemorragia_Digestiva_Alta_na_Emergencia':'TOCE - Hemorragia digestiva alta na emergência',
          'TOCE.-.Hernia.inguinal.pt.1':'TOCE - Hérnia inguinal pt. 1','TOCE.-.Hernia.inguinal.pt.2':'TOCE - Hérnia inguinal pt. 2','TOCE.-.Hernia.inguinal.-.atualizacoes.2023':'TOCE - Hérnia inguinal - atualizações 2023',
          'TOCE.-.CA.de.esofago':'TOCE - CA de esôfago','TOCE.-.CA.de.Estomago':'TOCE - CA de estômago','TOCE.-.CA.colorretal':'TOCE - CA colorretal',
          'xABCDE.e.os.choques.do.trauma':'xABCDE e os choques do trauma','TOCE.-.Queimados.-.pt.1':'TOCE - Queimados - pt. 1','TOCE.-.Queimados.-.pt.2':'TOCE - Queimados - pt. 2','TOCE.-.Queimados.-.pt.3':'TOCE - Queimados - pt. 3','TOCE.-.Queimados.-.pt.4':'TOCE - Queimados - pt. 4',
          'As_Armadilhas_Fisiologicas_da_Cirurgia_Neonatal':'As Armadilhas Fisiológicas da Cirurgia Neonatal',
          'PMSUS.-.Diretriz.Brasileira.2025.e.AHA.2026':'PMSUS - Diretriz Brasileira 2025 e AHA 2026','PMSUS.-.Hipotireodismo.clinico.e.subclinico.-.Diagnostico':'PMSUS - Hipotireoidismo clínico e subclínico - Diagnóstico','PMSUS.-.Hipotireodismo.-.manejo':'PMSUS - Hipotireoidismo - manejo','PMSUS.-.Nodulos.tireodeos.-.diagnostico.e.manejo':'PMSUS - Nódulos tireoidianos - diagnóstico e manejo','PMSUS.-.Crescimento.infantil':'PMSUS - Crescimento infantil','PMSUS.-.Puberdade.precoce':'PMSUS - Puberdade precoce','PMSUS.-.puberdade.tardia':'PMSUS - Puberdade tardia','Epilepsia.PCDT':'Epilepsia PCDT'
        };
        if(exact[raw])return exact[raw];
        let s=raw.replace(/\.m4a$/i,'').replace(/[._-]+/g,' ').replace(/\s+/g,' ').trim();
        s=s.replace(/^Intoxicacao\s*/i,'Intoxicação - ').replace(/^Abordagem geral das intoxicacoes/i,'Abordagem geral das intoxicações')
          .replace(/Bulimina/gi,'Bulimia').replace(/SOMP/gi,'SOMP').replace(/Cushing/gi,'Cushing')
          .replace(/Diagnostico/gi,'Diagnóstico').replace(/diagnostico/gi,'diagnóstico').replace(/Fisiopatologia/gi,'Fisiopatologia')
          .replace(/encefalopatia hipertensiva na emergencia/i,'encefalopatia hipertensiva na emergência').replace(/pre eclampsia/gi,'pré-eclâmpsia').replace(/Sindrome HELLP/gi,'Síndrome HELLP')
          .replace(/Doencas exantematicas da infancia/gi,'Doenças exantemáticas da infância').replace(/Fisiopatolgia/gi,'Fisiopatologia').replace(/Hanseniase/gi,'Hanseníase').replace(/herpes zoster/gi,'herpes zoster')
          .replace(/Anorexia nervosa/gi,'Anorexia nervosa').replace(/Sindrome metabolica/gi,'Síndrome metabólica').replace(/compulsao alimentar/gi,'compulsão alimentar')
          .replace(/Bronquiolite em crianca/gi,'Bronquiolite em criança').replace(/Cetoacidose e EHH/gi,'Cetoacidose e EHH').replace(/tratamento inicial de SCA/gi,'Tratamento inicial de SCA');
        return s;
      }
      function classify(file){
        const n=file.toLowerCase();
        if(n.startsWith('hmec.-.bls')||n.startsWith('hmec.-.acls')||n.includes('farmacologia_da_parada')||n.includes('cuidados.pos-pcr')||n.includes('salvando.cerebro')||n.includes('obstrucao.de.vias'))return ['HMEC (Emergências Clínicas)','Parada Cardiorrespiratória (BLS / ACLS AHA 2025)'];
        if(n.includes('sepse'))return ['HMEC (Emergências Clínicas)','Sepse'];
        if(n.startsWith('iam.'))return ['HMEC (Emergências Clínicas)','Cardiologia (Consenso ESC IAM 2026)'];
        if(n.includes('sindromes.hipertensivas.na.gestacao'))return ['HMEC (Emergências Clínicas)','Emergências Obstétricas (Síndromes Hipertensivas)'];
        if(n.includes('intoxic')||n.includes('abordagem.geral.das.intoxic'))return ['HMEC (Emergências Clínicas)','Toxicologia (Intoxicações Exógenas)'];
        if(n.includes('crise.convulsiva'))return ['HMEC (Emergências Clínicas)','Neurologia de Emergência'];
        if(n.startsWith('toce')){
          if(/abdome\.(agudo|obstrutivo|isquemico)|abdome\.obstrutivo|volvo\.sigmoide/i.test(n))return ['TOCE (Clínica Cirúrgica e Trauma)','Abdome Agudo (Geral, Obstrutivo e Vascular)'];
          if(/apendicite|colecistite|diverticulite|pancreatite/i.test(n))return ['TOCE (Clínica Cirúrgica e Trauma)','Abdome Agudo Inflamatório (Apendicite, Colecistite, Diverticulite e Pancreatite)'];
          if(/hemorragia_digestiva/i.test(n))return ['TOCE (Clínica Cirúrgica e Trauma)','Hemorragia Digestiva'];
          if(/hernia\.inguinal/i.test(n))return ['TOCE (Clínica Cirúrgica e Trauma)','Hérnias da Parede Abdominal'];
          if(/ca\.(de\.)?(esofago|estomago|colorretal)/i.test(n))return ['TOCE (Clínica Cirúrgica e Trauma)','Oncologia Gastrointestinal'];
          if(/queimados/i.test(n))return ['TOCE (Clínica Cirúrgica e Trauma)','Trauma e Queimados'];
          return ['TOCE (Clínica Cirúrgica e Trauma)','Abdome Agudo (Geral, Obstrutivo e Vascular)'];
        }
        if(n.includes('armadilhas.fisiologicas'))return ['TOCE (Clínica Cirúrgica e Trauma)','Cirurgia Pediátrica'];
        if(n.startsWith('xabcd'))return ['TOCE (Clínica Cirúrgica e Trauma)','Trauma e Queimados'];
        if(n.startsWith('pmsus')){
          if(n.includes('diretriz.brasileira'))return ['PMSUS (Atenção Primária e Ambulatório)','Hipertensão Arterial (Diretriz Brasileira 2025 / AHA 2026)'];
          if(n.includes('hipotire')||n.includes('nodulos.tire'))return ['PMSUS (Atenção Primária e Ambulatório)','Endocrinologia Tireoidiana'];
          if(n.includes('crescimento')||n.includes('puberdade'))return ['PMSUS (Atenção Primária e Ambulatório)','Crescimento e Desenvolvimento Infantil'];
        }
        if(n==='epilepsia.pcdt.m4a')return ['PMSUS (Atenção Primária e Ambulatório)','Neurologia Ambulatorial'];
        if(n.startsWith('ncs.-.sp.1.1'))return ['NCS','NCS complexo 1','SP 1.1 – Arritmias e Fibrilação Atrial'];
        if(n.startsWith('ncs.-.sp.1.2'))return ['NCS','NCS complexo 1','SP 1.2 – Síndromes Coronarianas Agudas (IAM)'];
        if(n.startsWith('ncs.-.sp.1.3'))return ['NCS','NCS complexo 1','SP 1.3 – Emergências Hipertensivas'];
        if(n.startsWith('ncs.-.sp.1.4'))return ['NCS','NCS complexo 1','SP 1.4 – Síndromes Hipertensivas na Gestação e HELLP'];
        if(n.startsWith('ncs.-.sp.1.5'))return ['NCS','NCS complexo 1','SP 1.5 – Emergências Respiratórias e PCR em Pediatria'];
        if(n.startsWith('ncs.-.2.1')||n.startsWith('ncs.-.2.2'))return ['NCS','NCS complexo 2','SP 2.1 e 2.2 – Diabetes Mellitus e Complicações Agudas'];
        if(n.startsWith('ncs.-.sp.2.2'))return ['NCS','NCS complexo 2','SP 2.2 – Síndrome de Cushing'];
        if(n.startsWith('ncs.-.sp.2.3'))return ['NCS','NCS complexo 2','SP 2.3 – Síndrome Metabólica e Transtornos Alimentares'];
        if(n.startsWith('ncs.-.sp.2.4'))return ['NCS','NCS complexo 2','SP 2.4 – Síndrome dos Ovários Policísticos (SOP)'];
        if(n.startsWith('ncs.-.sp.3.1')||n.startsWith('sp.3.1'))return ['NCS','NCS complexo 3','SP 3.1 – Dermatologia Infecciosa (Herpes Zoster e Hanseníase)'];
        if(n.startsWith('ncs.-.sp.3.2')||n.startsWith('sp.3.2'))return ['NCS','NCS complexo 3','SP 3.2 – Doenças Exantemáticas na Infância'];
        if(n.startsWith('ncs.-.sp.3.3')||n.startsWith('sp.3.3'))return ['NCS','NCS complexo 3','Reumatologia (Lúpus Eritematoso Sistêmico)'];
        return ['Outros','Outros áudios'];
      }
      const topOrder=['HMEC (Emergências Clínicas)','TOCE (Clínica Cirúrgica e Trauma)','PMSUS (Atenção Primária e Ambulatório)','NCS','Outros'];
      function render(){
        const q=search.value.trim().toLocaleLowerCase('pt-BR');
        const visible=tracks.map((t,index)=>({...t,index})).filter(t=>(t.name+' '+t.top+' '+t.sub+' '+(t.complex||'')).toLocaleLowerCase('pt-BR').includes(q)&&(!favoriteFilter||favorites.has(t.key)));
        list.replaceChildren();if(!visible.length){status.hidden=false;status.textContent=tracks.length?'Nenhum episódio encontrado.':'Nenhum áudio disponível.';return}status.hidden=true;
        const topGroups=new Map();for(const t of visible){if(!topGroups.has(t.top))topGroups.set(t.top,[]);topGroups.get(t.top).push(t)}
        for(const top of topOrder){if(!topGroups.has(top))continue;const topDetails=document.createElement('details');topDetails.className='module';topDetails.open=!!q;const topSummary=document.createElement('summary');topSummary.textContent=`📁 ${top} `;const topCount=document.createElement('span');topCount.className='module-count';topCount.textContent=`(${topGroups.get(top).length} episódios)`;topSummary.append(topCount);topDetails.append(topSummary);
          const innerGroups=new Map();for(const t of topGroups.get(top)){const key=top==='NCS'?`${t.complex}|||${t.sub}`:t.sub;if(!innerGroups.has(key))innerGroups.set(key,[]);innerGroups.get(key).push(t)}
          for(const [key,items] of innerGroups){const parts=key.split('|||');const heading=top==='NCS'?`📂 ${parts[0]} · ${parts[1]}`:parts[0];const section=document.createElement('details');section.className='submodule';section.open=!!q;const summary=document.createElement('summary');summary.textContent=`${heading} `;const count=document.createElement('span');count.className='module-count';count.textContent=`(${items.length})`;summary.append(count);section.append(summary);
            for(const t of items){const row=document.createElement('div');row.className='audio-row';const play=document.createElement('button');play.type='button';play.className=`play${current===t.index?' current':''}`;play.textContent=`${current===t.index&&!audio.paused?'⏸':'▶'} ${t.name}`;play.addEventListener('click',()=>playTrack(t.index));
              const heardLabel=document.createElement('label');heardLabel.className='heard';const check=document.createElement('input');check.type='checkbox';check.checked=heard.has(t.key);check.setAttribute('aria-label',`Marcar ${t.name} como ouvido`);check.addEventListener('change',()=>{check.checked?heard.add(t.key):heard.delete(t.key);saveSet('prontuario:heard',heard)});heardLabel.append(check,document.createTextNode(' Ouvido'));
              const fav=document.createElement('button');fav.type='button';fav.className=`fav${favorites.has(t.key)?' active':''}`;fav.textContent=favorites.has(t.key)?'♥':'♡';fav.title='Alternar favorito';fav.setAttribute('aria-label',`Favoritar ${t.name}`);fav.addEventListener('click',()=>{favorites.has(t.key)?favorites.delete(t.key):favorites.add(t.key);saveSet('prontuario:favorites',favorites);render()});row.append(play,heardLabel,fav);section.append(row)}topDetails.append(section)}list.append(topDetails)}
      }
      function saveSet(key,set){localStorage.setItem(key,JSON.stringify([...set]))}
      function playTrack(i){if(i<0||i>=tracks.length)return;current=i;const t=tracks[i];audio.src=t.url;$('nowPlaying').textContent=`Reproduzindo: ${t.name}`;$('notes').value=savedNotes[t.key]||'';audio.playbackRate=Number($('speed').value);render();audio.play().catch(err=>{console.error('Falha ao reproduzir áudio:',err);$('nowPlaying').textContent='Não foi possível reproduzir este áudio. Verifique a conexão e tente novamente.'})}
      function skip(seconds){if(Number.isFinite(audio.duration))audio.currentTime=Math.max(0,Math.min(audio.duration,audio.currentTime+seconds))}
      $('playPause').addEventListener('click',()=>{if(current<0){if(tracks.length)playTrack(0);return}if(audio.paused)audio.play().catch(console.error);else audio.pause()});audio.addEventListener('play',()=>{$('playPause').textContent='⏸ Pausar';render()});audio.addEventListener('pause',()=>{$('playPause').textContent='▶ Reproduzir';render()});
      audio.addEventListener('timeupdate',()=>{const p=audio.duration?audio.currentTime/audio.duration:0;const value=Math.round(p*1000);$('seek').value=value;$('seek').style.setProperty('--progress',`${p*100}%`);$('pig').style.left=`${p*100}%`;$('currentTime').textContent=fmt(audio.currentTime)});audio.addEventListener('loadedmetadata',()=>{$('duration').textContent=fmt(audio.duration)});
      $('seek').addEventListener('input',e=>{const p=Number(e.target.value)/10;e.target.style.setProperty('--progress',`${p}%`);$('pig').style.left=`${p}%`;if(audio.duration)audio.currentTime=p/100*audio.duration});$('back10').addEventListener('click',()=>skip(-10));$('forward30').addEventListener('click',()=>skip(30));
      $('previous').addEventListener('click',()=>{if(current>0)playTrack(current-1)});$('next').addEventListener('click',()=>{if(current+1<tracks.length)playTrack(current+1)});audio.addEventListener('ended',()=>{if(current>=0){heard.add(tracks[current].key);saveSet('prontuario:heard',heard);render()}if(continuous&&current+1<tracks.length)playTrack(current+1);else if(continuous&&tracks.length)playTrack(0)});
      $('continuous').addEventListener('click',e=>{continuous=!continuous;e.currentTarget.setAttribute('aria-pressed',String(continuous));e.currentTarget.textContent=continuous?'🔁 Contínuo: sim':'🔁 Contínuo: não'});$('speed').addEventListener('change',e=>{audio.playbackRate=Number(e.target.value)});$('volume').addEventListener('input',e=>{audio.volume=Number(e.target.value)});
      $('notes').addEventListener('input',()=>{if(current>=0){savedNotes[tracks[current].key]=$('notes').value;localStorage.setItem('prontuario:notes',JSON.stringify(savedNotes))}});search.addEventListener('input',render);$('favoritesOnly').addEventListener('click',e=>{favoriteFilter=!favoriteFilter;e.currentTarget.setAttribute('aria-pressed',String(favoriteFilter));e.currentTarget.textContent=favoriteFilter?'★ Todos':'☆ Favoritos';render()});$('theme').addEventListener('click',()=>{document.body.classList.toggle('light');localStorage.setItem('prontuario:theme',document.body.classList.contains('light')?'light':'dark')});if(localStorage.getItem('prontuario:theme')==='light')document.body.classList.add('light');
      function fmt(sec){if(!Number.isFinite(sec))return '0:00';const m=Math.floor(sec/60),s=Math.floor(sec%60);return `${m}:${String(s).padStart(2,'0')}`}
      fetch(API,{headers:{Accept:'application/vnd.github+json'}}).then(r=>{if(!r.ok)throw Error(`HTTP ${r.status}`);return r.json()}).then(release=>{
        tracks=(release.assets||[]).filter(a=>/\.m4a$/i.test(a.name)).map(a=>{const classification=classify(a.name);return {key:a.name,name:titleFor(a.name),url:a.browser_download_url,top:classification[0],sub:classification.at(-1),complex:classification.length===3?classification[1]:''}});
        tracks.sort((a,b)=>topOrder.indexOf(a.top)-topOrder.indexOf(b.top)||a.complex.localeCompare(b.complex,'pt-BR')||a.sub.localeCompare(b.sub,'pt-BR')||a.name.localeCompare(b.name,'pt-BR'));
        status.textContent=tracks.length?'':'Nenhum arquivo M4A encontrado nesta versão.';render();
      }).catch(err=>{console.error('Erro ao carregar áudios:',err);status.textContent='Não foi possível carregar os áudios. Confira sua conexão e tente novamente.'});
    })();
  </script>
</body>
